name: capability-registry-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: Monday 04:00 UTC = 09:30 IST. Re-runs evidence that has aged out.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify registry, gates and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (stdlib only, no installs)
        run: python -m unittest discover -s tests -v

      - name: "Preflight (fail-closed: exit 2 missing/tampered, 1 dishonest)"
        run: python scripts/preflight.py --registry capability-registry.json --max-evidence-days 90

      - name: Registry self-check
        run: python scripts/capability_registry.py check --max-age-days 120

      - name: Audit hash chain
        run: python scripts/capability_registry.py verify-audit

      - name: Re-verification (dry run on push)
        if: github.event_name != 'schedule'
        run: python scripts/reverify.py --registry capability-registry.json --max-age-days 90 --dry-run

      - name: Dependency and licence inventory
        run: python scripts/deps_inventory.py --markdown deps-inventory.md

      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: deps-inventory
          path: deps-inventory.md
          retention-days: 30

  supply-chain:
    name: Vulnerability audit (free, OSV/PyPI advisory data)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the audit tool pinned (the only dependency this repo has)
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      - name: Audit the job environment
        run: python -m pip_audit --local

  weekly-reverify:
    name: Weekly re-verification (live, scheduled only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-run stale evidence and demote failures
        run: python scripts/reverify.py --registry capability-registry.json --max-age-days 90

      - name: Build the weekly report
        if: always()
        run: python scripts/weekly_report.py --out weekly-report.md --max-evidence-days 90

      - name: Upload registry state and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-state
          path: |
            weekly-report.md
            capability-registry.json
            capability-registry.json.audit.jsonl
          retention-days: 90

      - name: Fail the run when a demotion happened
        if: always()
        run: python scripts/check_failed.py --registry capability-registry.json
